name: CI/CD Pipeline - Test, Build & Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest Unit Tests
        run: pnpm test

  build:
    name: 🏗️ Build Angular 21 SSR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production SSR
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/
          retention-days: 1

  deploy:
    name: 🚀 Deploy to Oracle VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ssh.arecofix.com.ar >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Package and Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'ssh.arecofix.com.ar' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
        run: |
          # 1. Comprimir bundle
          tar -czf dist.tar.gz -C dist arecofix

          # 2. Backup remoto
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /home/ubuntu/arecofix/dist_backup && cp -rf /home/ubuntu/arecofix/dist/arecofix /home/ubuntu/arecofix/dist_backup/ 2>/dev/null || true"

          # 3. Transferencia segura
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no dist.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/arecofix/dist.tar.gz"

          # 4. Descompresión y recarga de PM2
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzf /home/ubuntu/arecofix/dist.tar.gz -C /home/ubuntu/arecofix/dist/ && rm -f /home/ubuntu/arecofix/dist.tar.gz && pm2 reload arecofix-frontend || pm2 restart arecofix-frontend"

      - name: Healthcheck Verification
        run: |
          echo "Verificando disponibilidad en https://arecofix.com.ar..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://arecofix.com.ar || true)
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ Despliegue validado exitosamente."
              exit 0
            fi
            sleep 4
          done
          echo "❌ Healthcheck falló en producción."
          exit 1
