# ==============================================================================
# ARECOFIX - NGINX PRODUCTION CONFIGURATION TEMPLATE
# ==============================================================================
# Ubicación en VPS: /etc/nginx/sites-available/arecofix_frontend
# Enlace simbólico: /etc/nginx/sites-enabled/arecofix_frontend
#
# Comandos de activación:
#   sudo ln -sf /etc/nginx/sites-available/arecofix_frontend /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAMS (BALANCEO Y SERVICIOS INTERNOS)
# ------------------------------------------------------------------------------
upstream angular_ssr {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream flask_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 2. SERVIDOR PRINCIPAL: arecofix.com.ar & SUBDOMINIOS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name arecofix.com.ar www.arecofix.com.ar ssh.arecofix.com.ar;

    # Tamaño máximo de subida para comprobantes e imágenes
    client_max_body_size 25M;

    # Compresión Gzip para optimización de transferencia
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # RESTAURACIÓN DE IP REAL DESDE CLOUDFLARE
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # --------------------------------------------------------------------------
    # CABECERAS DE SEGURIDAD ESTÁNDAR
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;

    # --------------------------------------------------------------------------
    # ARCHIVOS DEL SERVICE WORKER (PWA)
    # Regla crítica: NUNCA almacenar en caché en disco/proxy para forzar actualización
    # --------------------------------------------------------------------------
    location ~* (ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        proxy_pass http://angular_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # --------------------------------------------------------------------------
    # ARCHIVOS ESTÁTICOS CON HASH DE PRODUCCIÓN (CACHE INMUTABLE)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        alias /home/ubuntu/arecofix/dist/arecofix/browser;
        try_files $uri @ssr_fallback;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # API BACKEND (FLASK REST SERVICES)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # APLICACIÓN ANGULAR SSR (EXPRESS SERVER)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://angular_ssr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @ssr_fallback {
        proxy_pass http://angular_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
