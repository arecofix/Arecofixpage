    <!-- Global Noise Suppressor (EXECUTE FIRST) -->
    <script>
      (function() {
        'use strict';
        const noise = [
          'cross-origin-opener-policy', 'attribution-reporting', 'browsing-topics', 
          'fbevents.js', 'google-analytics', 'googletagmanager', 'doubleclick', 
          'facebook', 'gtm', 'gtag', 'user-agent-client-hints', 'permissions-policy', 
          'unrecognized feature', 'private-state-token', 'join-ad-interest-group', 
          'run-ad-auction', 'interest-cohort', 'ad-auction', 'ad-interest-group',
          'attribution-reporting', 'fbevents', 'rrweb', 'posthog', 'fbq'
        ];
        const isNoise = (args) => {
          const msg = args.map(a => { 
            try { return typeof a === 'string' ? a : JSON.stringify(a); } 
            catch(e) { return String(a); } 
          }).join(' ').toLowerCase();
          return noise.some(n => msg.includes(n));
        };
        const _err = console.error, _wrn = console.warn, _log = console.log;
        console.error = (...a) => { if (!isNoise(a)) _err.apply(console, a); };
        console.warn = (...a) => { if (!isNoise(a)) _wrn.apply(console, a); };
        console.log = (...a) => { if (!isNoise(a)) _log.apply(console, a); };
        
        // Catch-all for browser-level logs that might not go through console.warn/error directly
        const _debug = console.debug;
        console.debug = (...a) => { if (!isNoise(a)) _debug.apply(console, a); };

        window.addEventListener('error', (e) => { 
          if (isNoise([e.message, e.filename])) { 
            e.stopImmediatePropagation(); 
            e.preventDefault(); 
          } 
        }, true);
        window.addEventListener('unhandledrejection', (e) => { 
          if (isNoise([String(e.reason)])) { 
            e.stopImmediatePropagation(); 
            e.preventDefault(); 
          } 
        }, true);

        // Suppress specific library noise that bypasses standard listeners
        if (window.console) {
            const _err = console.error;
            console.error = function() {
                if (isNoise(Array.from(arguments))) return;
                _err.apply(console, arguments);
            };
        }

        // Mock FeaturePolicy to prevent 'attribution-reporting' unrecognized feature warnings
        try {
          if (document.featurePolicy) {
            if (typeof document.featurePolicy.allowsFeature === 'function') {
              const origAllows = document.featurePolicy.allowsFeature;
              document.featurePolicy.allowsFeature = function(f) {
                if (f === 'attribution-reporting') return false;
                try { return origAllows.call(this, f); } catch(e) { return false; }
              };
            }
            if (typeof document.featurePolicy.features === 'function') {
              const origFeatures = document.featurePolicy.features;
              document.featurePolicy.features = function() {
                try {
                  return origFeatures.call(this).filter(f => f !== 'attribution-reporting');
                } catch(e) {
                  return [];
                }
              };
            }
            if (typeof document.featurePolicy.allowedFeatures === 'function') {
              const origAllowed = document.featurePolicy.allowedFeatures;
              document.featurePolicy.allowedFeatures = function() {
                try {
                  return origAllowed.call(this).filter(f => f !== 'attribution-reporting');
                } catch(e) {
                  return [];
                }
              };
            }
          }
        } catch (e) {}
      })();
    </script>

      <!-- Initial Loader shown before Angular bootstraps -->
      <style>
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
          color: white;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          position: fixed;
          top: 0;
          left: 0;
          z-index: 99999;
        }
        .loader-logo-container {
          position: relative;
          width: 80px;
          height: 80px;
          margin-bottom: 24px;
        }
        .loader-ring {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 4px solid rgba(99, 102, 241, 0.1);
          border-left-color: #6366f1; /* Indigo 500 */
          border-right-color: #8b5cf6; /* Violet 500 */
          border-radius: 50%;
          animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .loader-ring-inner {
          position: absolute;
          top: 10px;
          left: 10px;
          width: calc(100% - 20px);
          height: calc(100% - 20px);
          border: 4px solid rgba(236, 72, 153, 0.1);
          border-top-color: #ec4899; /* Pink 500 */
          border-bottom-color: #3b82f6; /* Blue 500 */
          border-radius: 50%;
          animation: spin-reverse 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }
        .loading-text-container {
          display: flex;
          align-items: baseline;
          gap: 4px;
        }
        .loading-text {
          font-size: 1.25rem;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
          background: linear-gradient(to right, #6366f1, #ec4899);
          -webkit-background-clip: text;
          color: transparent;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .loading-dots::after {
          content: '.';
          font-size: 1.5rem;
          font-weight: 700;
          color: #ec4899;
          animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; filter: brightness(1); }
          50% { opacity: 0.7; filter: brightness(1.2); }
        }
        @keyframes dots {
          0%, 20% { color: rgba(236,72,153,0); text-shadow: .25em 0 0 rgba(236,72,153,0), .5em 0 0 rgba(236,72,153,0); }
          40% { color: #ec4899; text-shadow: .25em 0 0 rgba(236,72,153,0), .5em 0 0 rgba(236,72,153,0); }
          60% { text-shadow: .25em 0 0 #ec4899, .5em 0 0 rgba(236,72,153,0); }
          80%, 100% { text-shadow: .25em 0 0 #ec4899, .5em 0 0 #ec4899; }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-logo-container">
          <div class="loader-ring"></div>

        </div>
        <div class="loading-text-container">
