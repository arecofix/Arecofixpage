@if (tabs().length > 0) {
  <nav
    class="w-full bg-slate-100/90 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800 flex items-center relative z-30 select-none print:hidden"
    aria-label="Navegación por pestañas"
  >
    <!-- Left Scroll Button (Mobile / Small screens) -->
    <button
      type="button"
      (click)="scrollLeft()"
      aria-label="Desplazar pestañas a la izquierda"
      class="hidden sm:flex items-center justify-center w-7 h-9 text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-200/60 dark:hover:bg-slate-800 transition-colors shrink-0"
    >
      <i class="fas fa-chevron-left text-[10px]"></i>
    </button>

    <!-- Scrollable Tablist Container -->
    <div
      #tabsContainer
      role="tablist"
      aria-label="Pestañas abiertas"
      class="tab-bar-container flex-1 flex items-center overflow-x-auto no-scrollbar scroll-smooth px-2 pt-1.5 gap-1.5"
    >
      @for (tab of tabs(); track tab.url; let i = $index) {
        <div
          role="presentation"
          class="inline-flex items-center shrink-0"
        >
          <button
            type="button"
            role="tab"
            [id]="'admin-tab-' + i"
            [attr.aria-selected]="tab.active"
            [attr.aria-controls]="'admin-tabpanel-' + i"
            [attr.tabindex]="tab.active ? 0 : -1"
            (touchstart)="onTouchStart($event, tab)"
            (touchmove)="onTouchMove($event)"
            (touchend)="onTouchEnd($event, tab)"
            (click)="onTabClick($event, tab)"
            (keydown)="onKeyDown($event, i)"
            class="tab-item group relative inline-flex items-center gap-2 px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-t-xl transition-all duration-150 border-t-2 border-x focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 cursor-pointer"
            [ngClass]="
              tab.active
                ? 'bg-white dark:bg-slate-900 border-t-indigo-600 dark:border-t-indigo-500 border-x-gray-200 dark:border-x-slate-800 text-indigo-600 dark:text-indigo-400 shadow-xs'
                : 'bg-gray-100/70 dark:bg-slate-800/40 border-transparent text-gray-500 dark:text-gray-400 hover:bg-gray-200/70 dark:hover:bg-slate-800/80 hover:text-gray-700 dark:hover:text-gray-300'
            "
          >
            <!-- Tab Icon (Contextual) -->
            @if (tab.url.includes('/dashboard')) {
              <i class="fas fa-chart-pie text-[11px] opacity-75"></i>
            } @else if (tab.url.includes('/sales/invoices')) {
              <i class="fas fa-file-invoice-dollar text-[11px] opacity-75"></i>
            } @else if (tab.url.includes('/sales')) {
              <i class="fas fa-cash-register text-[11px] opacity-75"></i>
            } @else if (tab.url.includes('/repairs')) {
              <i class="fas fa-tools text-[11px] opacity-75"></i>
            } @else {
              <i class="fas fa-layer-group text-[11px] opacity-75"></i>
            }

            <!-- Title -->
            <span class="whitespace-nowrap max-w-[120px] sm:max-w-[180px] truncate leading-tight">
              {{ tab.title }}
            </span>

            <!-- Close Tab Button (Fat-finger friendly touch area) -->
            <span
              role="button"
              tabindex="0"
              [attr.aria-label]="'Cerrar pestaña ' + tab.title"
              (touchstart)="closeTab(i, $event)"
              (touchend)="closeTab(i, $event)"
              (click)="closeTab(i, $event)"
              (keydown.enter)="closeTab(i, $event)"
              (keydown.space)="closeTab(i, $event)"
              class="w-6 h-6 -mr-1 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-gray-200 dark:hover:bg-slate-700/80 transition-colors ml-1"
            >
              <i class="fas fa-times text-[9px] pointer-events-none"></i>
            </span>
          </button>
        </div>
      }
    </div>

    <!-- Right Scroll Button (Mobile / Small screens) -->
    <button
      type="button"
      (click)="scrollRight()"
      aria-label="Desplazar pestañas a la derecha"
      class="hidden sm:flex items-center justify-center w-7 h-9 text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-200/60 dark:hover:bg-slate-800 transition-colors shrink-0"
    >
      <i class="fas fa-chevron-right text-[10px]"></i>
    </button>

    <!-- Close All Tabs (Optional action) -->
    @if (tabs().length > 2) {
      <button
        type="button"
        (click)="closeAll()"
        title="Cerrar todas las pestañas"
        aria-label="Cerrar todas las pestañas"
        class="hidden md:flex items-center gap-1 px-2.5 py-1.5 text-[10px] font-bold text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-lg mx-2 transition-colors shrink-0 uppercase tracking-wider"
      >
        <i class="fas fa-times-circle"></i>
        <span>Limpiar</span>
      </button>
    }
  </nav>
}
