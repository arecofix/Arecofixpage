@if (!isPortfolioRoute()) {
  <public-layout-header></public-layout-header>
}
<div
  [ngClass]="[
    preferencesService.getBackgroundClass((preferencesService.theme$ | async)!),
    (preferencesService.highContrast$ | async) ? 'high-contrast' : '',
  ]"
  class="min-h-[100dvh] flex flex-col transition-all duration-300 relative text-gray-900 dark:text-gray-100 font-sans pt-16"
>
  <main class="flex-grow flex flex-col relative w-full">
    <router-outlet></router-outlet>
  </main>
  
  <div class="mt-auto">
    <app-footer></app-footer>
    <!-- Spacer for floating action buttons (FABs) and Safe Area on mobile -->
    <div class="h-24 lg:h-0 w-full" style="padding-bottom: env(safe-area-inset-bottom);"></div>
  </div>
</div>

<app-accessibility-sidebar></app-accessibility-sidebar>
<app-ai-chatbot></app-ai-chatbot>
