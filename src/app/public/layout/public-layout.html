@if (showHeader()) {
<public-layout-header></public-layout-header>
}

<div [ngClass]="themeClass()" [class.high-contrast]="isHighContrast()"
  class="min-h-[100dvh] flex flex-col relative text-gray-900 dark:text-gray-100 transition-colors duration-300">
  <main class="flex-grow flex flex-col relative w-full"
    [style.padding-top]="showHeader() ? 'var(--header-height)' : '0'">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>

  <app-accessibility-sidebar></app-accessibility-sidebar>
  <app-ai-chatbot></app-ai-chatbot>
</div>
