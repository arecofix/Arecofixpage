<!-- Force Password Change Modal Overlay -->
<div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" id="force-password-change-overlay">
  
  <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-700 animate-fade-in">
    
    <!-- Header gradient bar -->
    <div class="h-1.5 bg-gradient-to-r from-blue-500 via-purple-500 to-emerald-500"></div>
    
    <!-- Success State -->
    <div *ngIf="success()" class="p-8 text-center">
      <div class="w-20 h-20 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center mx-auto mb-5 text-4xl text-emerald-500">
        <i class="fas fa-shield-check"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-2">¡Contraseña actualizada!</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm">Tu contraseña ha sido guardada de forma segura. Redirigiendo...</p>
    </div>

    <!-- Form State -->
    <div *ngIf="!success()" class="p-8">
      
      <!-- Icon + Title -->
      <div class="flex items-start gap-4 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center shrink-0 text-amber-500 text-xl">
          <i class="fas fa-key"></i>
        </div>
        <div>
          <h2 class="text-xl font-black text-slate-900 dark:text-white leading-tight">Cambio de Contraseña Obligatorio</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
            Por seguridad, debes establecer una contraseña personalizada antes de continuar.
          </p>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMsg()" id="force-pwd-error"
        class="mb-5 flex items-center gap-3 bg-rose-50 dark:bg-rose-900/20 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-400 rounded-xl p-4 text-sm">
        <i class="fas fa-exclamation-circle shrink-0"></i>
        <span>{{ errorMsg() }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

        <!-- New Password -->
        <div class="form-control">
          <label class="label"><span class="label-text font-semibold text-slate-700 dark:text-slate-300">Nueva Contraseña</span></label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="input-new-password"
              formControlName="password"
              placeholder="Mínimo 8 caracteres"
              class="input input-bordered w-full pr-12 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
              [class.input-error]="password?.invalid && password?.touched" />
            <button type="button" (click)="showPassword.set(!showPassword())"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
              <i [class]="showPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div class="mt-1.5 space-y-1" *ngIf="password?.touched">
            <p class="text-xs flex items-center gap-1.5" [class]="(password?.value?.length ?? 0) >= 8 ? 'text-emerald-500' : 'text-slate-400'">
              <i [class]="(password?.value?.length ?? 0) >= 8 ? 'fas fa-check-circle' : 'far fa-circle'"></i> Mínimo 8 caracteres
            </p>
            <p class="text-xs flex items-center gap-1.5" [class]="/[A-Z]/.test(password?.value ?? '') ? 'text-emerald-500' : 'text-slate-400'">
              <i [class]="/[A-Z]/.test(password?.value ?? '') ? 'fas fa-check-circle' : 'far fa-circle'"></i> Una letra mayúscula
            </p>
            <p class="text-xs flex items-center gap-1.5" [class]="/[0-9]/.test(password?.value ?? '') ? 'text-emerald-500' : 'text-slate-400'">
              <i [class]="/[0-9]/.test(password?.value ?? '') ? 'fas fa-check-circle' : 'far fa-circle'"></i> Un número
            </p>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-control">
          <label class="label"><span class="label-text font-semibold text-slate-700 dark:text-slate-300">Confirmar Contraseña</span></label>
          <div class="relative">
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              id="input-confirm-password"
              formControlName="confirmPassword"
              placeholder="Repite tu nueva contraseña"
              class="input input-bordered w-full pr-12 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
              [class.input-error]="form.hasError('mismatch') && confirmPassword?.touched" />
            <button type="button" (click)="showConfirmPassword.set(!showConfirmPassword())"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
              <i [class]="showConfirmPassword() ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <label class="label" *ngIf="form.hasError('mismatch') && confirmPassword?.touched">
            <span class="label-text-alt text-rose-500">Las contraseñas no coinciden.</span>
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          id="btn-save-password"
          class="btn btn-primary w-full mt-2 gap-2"
          [disabled]="loading()">
          <span *ngIf="loading()" class="loading loading-spinner loading-sm"></span>
          <i *ngIf="!loading()" class="fas fa-lock"></i>
          {{ loading() ? 'Guardando...' : 'Guardar Nueva Contraseña' }}
        </button>

      </form>
    </div>
  </div>
</div>
