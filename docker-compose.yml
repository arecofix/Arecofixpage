version: '3.8'

services:
  db:
    image: supabase/postgres:15.1.0.117
    container_name: supabase-db
    restart: always
    environment:
      POSTGRES_PASSWORD: eze321
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - pgaudit.log=all

  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase-rest
    restart: always
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://postgres:eze321@db:5432/postgres
      PGRST_DB_SCHEMA: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_SERVER_PORT: 3000
    ports:
      - "3000:3000"

  kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: always
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml

  meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: supabase-meta
    restart: always
    depends_on:
      - db
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: eze321
    ports:
      - "8080:8080"

  studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    restart: always
    depends_on:
      - meta
      - rest
      - db
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: eze321
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: anon-key-placeholder
      SUPABASE_SERVICE_KEY: service-key-placeholder
    ports:
      - "54323:3000"
    # Note: If port 3000 is taken by rest, you may need to map it differently, e.g. "54323:3000"
    # Actually, changing to "54323:3000" to avoid conflict with rest which is on 3000:3000.

volumes:
  pgdata:
